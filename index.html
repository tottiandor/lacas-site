<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laca's Site — creative industry news, live</title>
<meta name="description" content="Live headlines from across the creative, advertising and design press, collected in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-inner">
    <div class="brand">
      <h1>Laca&rsquo;s Site</h1>
      <p class="tagline">Creative industry news, gathered as it lands.</p>
    </div>
    <div class="status">
      <span class="pulse" id="pulse" aria-hidden="true"></span>
      <span id="status-text">Loading&hellip;</span>
      <button id="refresh" type="button" title="Check for new stories">Refresh</button>
    </div>
  </div>
</header>

<nav class="controls" aria-label="Filter stories">
  <div class="wrap controls-inner">
    <div class="chips" id="chips" role="group" aria-label="Filter by source"></div>
    <div class="search">
      <input id="search" type="search" placeholder="Search headlines&hellip;" aria-label="Search headlines" autocomplete="off">
    </div>
  </div>
</nav>

<main class="wrap" id="main">
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Nothing matches that. Try a different search or source.</p>
</main>

<footer class="wrap site-footer">
  <p><strong>Laca&rsquo;s Site</strong> is a prototype news aggregator. Every headline links straight to the
     publisher &mdash; all articles remain the property of their original source.</p>
  <p id="source-list" class="source-list"></p>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
